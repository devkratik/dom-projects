<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="reset-password.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="container__title">Password Generator</div>
      <div class="container__title-underline"></div>

      <!--Password container-->
      <div class="passwordContainer">
        <input
          class="passwordContainer__password"
          type="text"
          readonly
          id="password"
        />
        <div class="passwordContainer__copy">
          <i class="far fa-copy" id="copy-btn" title="copy to clipboard"></i>
        </div>
      </div>

      <!--Options-->
      <div class="options">
        <!--Password length-->
        <div class="option">
          <label for="length">Password Length</label>
          <div class="range-container">
            <input type="range" id="length" min="6" max="24" value="12" />
            <span class="option__length-value" id="length-value">12</span>
          </div>
        </div>
        <!--include uppercase-->
        <div class="option">
          <label for="uppercase">Include Uppercase</label>
          <input type="checkbox" id="uppercase" checked />
        </div>
        <!--include lowercase-->
        <div class="option">
          <label for="lowercase">Include Lowercase</label>
          <input type="checkbox" id="lowercase" checked />
        </div>
        <!--include Numbers-->
        <div class="option">
          <label for="numbers">Include Numbers</label>
          <input type="checkbox" id="numbers" checked />
        </div>
        <!--Include Symbols-->
        <div class="option">
          <label for="symbols">Include Symbols</label>
          <input type="checkbox" id="symbols" checked />
        </div>
      </div>
      <!--Button-->
      <button class="button__generate" id="generate-btn">
        <i class="fas fa-key"></i> Generate Password
      </button>
      <!--Strength container-->
      <div class="strength-container">
        <p>Password Strength:</p>
        <span id="strength-label">weak</span>
      </div>
      <!--strength-->
      <div class="strength">
        <div class="strength__meter">
          <div class="strength__bar"></div>
        </div>
      </div>
    </div>
  </body>
</html>
