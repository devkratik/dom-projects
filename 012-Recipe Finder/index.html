<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="header__title">
          <i class="fa-solid fa-utensils"></i>
          Recipe Finder
        </h1>
        <p class="header__subtitle">
          Search for famous recipes around the world.
        </p>
        <p class="header__data-info">
          Data from
          <a
            class="header__data-source"
            href="https://themealdb.com"
            target="_blank"
            >TheMealDB🍻</a
          >
        </p>
        <form class="header__form">
          <input
            type="text"
            class="header__form-input"
            placeholder="Search for recipe or keyword"
            id="search-input"
          />
          <button class="header__form-search" type="submit" id="search-btn">
            Search
          </button>
        </form>
      </div>
      <div class="error hidden" id="search-error">
        <p class="error__content">error goes here</p>
      </div>
      <div class="search-heading hidden">
        <p class="search-heading__content">Search results for "chicken" :</p>
      </div>
      <div class="container__meals"></div>
      <div class="container__meal-details hidden">
        <button class="back-btn">
          <i class="fa-solid fa-arrow-left"></i>
          Back to recipes
        </button>
        <div class="meal-details"></div>
      </div>
    </div>
  </body>
</html>
